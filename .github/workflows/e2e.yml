name: E2E tests

on:
  # Every push only builds the framework: a test run registers test users in the deployed environment,
  # so the full run is started on purpose (Actions -> E2E tests -> Run workflow) or by setting RUN_ON_PUSH.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      filter:
        description: "dotnet test filter, e.g. Category=L1, Category=api, Category=smoke (empty = all)"
        required: false
        default: ""

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/GreenTasty.E2E -c Release

  e2e:
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.RUN_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ vars.APP_URL }}
      API_URL: ${{ vars.API_URL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/GreenTasty.E2E -c Release

      - name: Install Chromium for Playwright
        run: pwsh tests/GreenTasty.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        # A failed test must not stop the pipeline: the report and artifacts are published anyway.
        continue-on-error: true
        run: >
          dotnet test tests/GreenTasty.E2E -c Release --no-build
          ${{ github.event.inputs.filter != '' && format('--filter "{0}"', github.event.inputs.filter) || '' }}
          --logger "trx;LogFileName=results.trx"
          --logger "html;LogFileName=results.html"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Collect reports
        if: always()
        run: |
          mkdir -p TestResults
          cp -r tests/GreenTasty.E2E/bin/Release/net10.0/TestResults/* TestResults/ 2>/dev/null || true

      - name: Test report (Checks tab)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: TestResults/

      - name: Upload traces, screenshots and videos of failed scenarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: artifacts/
          if-no-files-found: ignore
